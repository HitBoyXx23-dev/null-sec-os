<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020604" />
  <meta name="description" content="Null Sec OS, a browser based cyber desktop." />
  <title>NULL SEC // OS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-mark">[ NULL//SEC ]</div>
    <div id="boot-log" class="boot-log"></div>
    <div class="boot-progress"><i></i></div>
    <div class="boot-hint">SECURE WEB ENVIRONMENT</div>
  </div>

  <main id="desktop" class="desktop hidden" aria-label="Null Sec OS desktop">
    <div class="scanlines"></div>
    <div class="grid-floor"></div>
    <div class="hud top-left">NULL_SEC<br><span>NODE: WEB-01</span></div>
    <div class="hud top-right"><span id="hud-time"></span><br><span>SESSION // ACTIVE</span></div>

    <section class="desktop-icons" aria-label="Desktop shortcuts">
      <button class="desktop-icon" data-open="browser"><span>◎</span><small>Relay</small></button>
      <button class="desktop-icon" data-open="terminal"><span>&gt;_</span><small>Terminal</small></button>
      <button class="desktop-icon" data-open="files"><span>▦</span><small>Vault</small></button>
      <button class="desktop-icon" data-open="ops"><span>⌁</span><small>Ops Center</small></button>
      <button class="desktop-icon" data-open="notes"><span>✎</span><small>Scratchpad</small></button>
      <button class="desktop-icon" data-open="settings"><span>⚙</span><small>Config</small></button>
    </section>

    <section id="window-layer" class="window-layer"></section>

    <aside id="start-menu" class="start-menu hidden">
      <div class="start-header">
        <div class="avatar">N</div>
        <div><b>NULL SEC</b><small>Operator: hitboyxx23</small></div>
      </div>
      <div class="start-status"><span>● SECURE SESSION</span><span>BUILD 2.0</span></div>
      <div class="start-grid">
        <button data-open="browser">◎ <span>Relay</span></button>
        <button data-open="terminal">&gt;_ <span>Terminal</span></button>
        <button data-open="files">▦ <span>Vault</span></button>
        <button data-open="ops">⌁ <span>Ops</span></button>
        <button data-open="notes">✎ <span>Notes</span></button>
        <button data-open="settings">⚙ <span>Config</span></button>
      </div>
      <div class="start-actions">
        <button data-open="about">SYSTEM INFO</button>
        <button id="restart-btn">REBOOT</button>
      </div>
    </aside>

    <footer class="taskbar">
      <button id="start-btn" class="start-btn">N</button>
      <div class="task-label">NULL//SEC</div>
      <div id="task-buttons" class="task-buttons"></div>
      <div class="tray"><span id="api-status">API ...</span><span id="net-status">NET ...</span><span id="clock"></span></div>
    </footer>
  </main>

  <template id="window-template">
    <article class="window">
      <header class="titlebar">
        <div class="title-wrap"><span class="title-led"></span><div class="title"></div></div>
        <div class="window-controls">
          <button data-action="minimize" aria-label="Minimize">_</button>
          <button data-action="maximize" aria-label="Maximize">□</button>
          <button data-action="close" aria-label="Close">×</button>
        </div>
      </header>
      <div class="window-body"></div>
      <div class="resize-handle"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
