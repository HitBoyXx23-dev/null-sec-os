<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#020506" />
  <meta name="description" content="Null Sec UBG, a browser arcade desktop with local games, media and tools." />
  <title>NULL SEC UBG</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="boot" class="boot-screen">
    <div class="boot-terminal">
      <div class="boot-terminal-head">
        <span>NULL SEC UBG</span>
        <span>BOOT/7.3</span>
      </div>
      <div class="boot-terminal-body">
        <div class="boot-line"><span>SYS</span><b>browser runtime</b><i>OK</i></div>
        <div class="boot-line"><span>FS</span><b>local game library</b><i id="boot-game-count">...</i></div>
        <div class="boot-line"><span>NET</span><b>scramjet relay</b><i>INIT</i></div>
        <div class="boot-line"><span>APP</span><b id="boot-phase">starting</b><i id="boot-state">...</i></div>
        <div class="boot-cursor">&gt; <span id="boot-command">boot null-ubg</span><em>█</em></div>
      </div>
      <div class="boot-progress"><i id="boot-progress-bar"></i></div>
    </div>
  </div>

  <main id="desktop" class="desktop hidden" aria-label="Null Sec OS desktop">
    <canvas id="matrix-bg"></canvas>
    <div class="scanlines"></div><div class="noise"></div>
    <header class="top-hud">
      <div><b>NULL SEC UBG</b><span>ARCADE NODE</span></div>
      <div class="hud-center">SYSTEM // <span id="hud-status">NOMINAL</span></div>
      <div class="hud-right"><span>UBG // READY</span></div>
    </header>

    <section id="desktop-icons" class="desktop-icons"></section>
    <section id="window-layer" class="window-layer"></section>

    <aside id="start-menu" class="start-menu hidden">
      <div class="start-head"><div class="hex">N</div><div><b>NULL SEC UBG</b><small>Local arcade desktop</small></div></div>
      <div class="start-search"><input id="app-search" placeholder="Search games, apps and tools..." /></div>
      <div class="start-tabs"><button class="active" data-cat="all">ALL</button><button data-cat="system">SYSTEM</button><button data-cat="tools">TOOLS</button><button data-cat="games">GAMES</button><button data-cat="media">MEDIA</button><button data-cat="comms">COMMS</button><button data-cat="intel">OSINT</button></div>
      <div id="app-grid" class="app-grid"></div>
      <div class="start-foot"><span><i class="status-dot"></i> SESSION SECURE</span><button data-open="about">ABOUT</button><button id="restart-btn">REBOOT</button></div>
    </aside>

    <footer class="taskbar">
      <button id="start-btn" class="start-btn">N</button>
      <div class="brand">NULL/UBG</div>
      <div id="task-buttons" class="task-buttons"></div>
      <div class="tray"><span id="api-status">RELAY ...</span><span id="net-status">NET ...</span></div>
    </footer>
  </main>

  <template id="window-template">
    <article class="window">
      <header class="titlebar"><div class="title-wrap"><span class="title-led"></span><div class="title"></div></div><div class="window-controls"><button data-action="minimize">_</button><button data-action="maximize">□</button><button data-action="close">×</button></div></header>
      <div class="window-body"></div><div class="resize-handle"></div>
    </article>
  </template>
  <script src="/vendor/hls/hls.min.js"></script>
  <script src="/vendor/scramjet/scramjet.js"></script>
  <script src="/vendor/controller/controller.api.js"></script>
  <script src="/client.js"></script>
</body>
</html>
